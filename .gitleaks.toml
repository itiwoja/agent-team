# gitleaks の設定（CI の「秘密情報の検査」。.github/workflows/ci.yml）。既定の規則をそのまま使い、誤検知だけを外す
[extend]
useDefault = true

[allowlist]
description = "ゲストのリハーサルの fixture の repeat_key（同じ呼び出しの繰り返しを数える SHA-256。秘密ではない）と、GitHub 連携の試験用の偽のインストールトークン"
regexTarget = "match"
regexes = [
  '''repeat_key":"[0-9a-f]{64}''',
  # 試験だけで使う偽のトークン（apps/github/src/test-helpers.ts・apps/gateway/src/github-auth.test.ts）。本物の値を通さないよう、文字列ごと固定する
  # 規則 github-app-token の一致は ghs_ のあと36文字までなので、末尾の f は含めない
  '''ghs_testinstallationtoken0123456789abcde''',
  '''ghs_installationtokenforgatewaytests0123''',
]
