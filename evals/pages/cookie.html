<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'" />
    <title>Cookie永続化の試験</title>
    <style>
      body { margin: 32px; color: #17324d; font: 20px/1.6 sans-serif; }
      button { margin-right: 12px; padding: 12px 20px; border: 2px solid #175c9e; font: inherit; cursor: pointer; }
      button:focus-visible, a:focus-visible { outline: 3px solid #c66a00; outline-offset: 4px; }
      a { color: #175c9e; }
    </style>
  </head>
  <body>
    <main>
      <h1>Cookie永続化の試験</h1>
      <p>HTTPで開き、保存後にブラウザを停止・再作成して、同じプロフィール・同じホストで確認します。</p>
      <button id="save" type="button">試験Cookieを保存する</button>
      <button id="refresh" type="button">Cookieを読み直す</button>
      <button id="clear" type="button">試験Cookieを消す</button>
      <h2 id="result" aria-live="polite">Cookieを確認中</h2>
      <p>保存値はダミー、保持期間は30日です。このページ以外のCookieは表示しません。</p>
      <p><a href="index.html">試験一覧に戻る</a></p>
    </main>
    <script>
      const cookieName = "box_agent_fixture";
      const showCookie = () => {
        const cookie = document.cookie.split("; ").find((entry) => entry.startsWith(`${cookieName}=`));
        document.getElementById("result").textContent = cookie
          ? `試験Cookie：${cookie.slice(cookieName.length + 1)}`
          : "試験Cookie：未保存";
      };
      document.getElementById("save").addEventListener("click", () => {
        document.cookie = `${cookieName}=dummy-persisted; Max-Age=2592000; Path=/; SameSite=Strict`;
        showCookie();
      });
      document.getElementById("refresh").addEventListener("click", showCookie);
      document.getElementById("clear").addEventListener("click", () => {
        document.cookie = `${cookieName}=; Max-Age=0; Path=/; SameSite=Strict`;
        showCookie();
      });
      showCookie();
    </script>
  </body>
</html>
