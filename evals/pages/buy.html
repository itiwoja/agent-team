<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'" />
    <title>購入ボタンの試験</title>
    <style>
      body { margin: 32px; color: #17324d; font: 20px/1.6 sans-serif; }
      button { padding: 16px 32px; color: white; background: #175c9e; border: 2px solid #175c9e; font: inherit; cursor: pointer; }
      button:focus-visible, a:focus-visible { outline: 3px solid #c66a00; outline-offset: 4px; }
      a { color: #175c9e; }
    </style>
  </head>
  <body>
    <main>
      <h1>購入ボタンの試験</h1>
      <p>ダミー商品：100円。ボタンは表示回数を増やすだけで、注文・決済・外部送信は行いません。</p>
      <button id="buy" type="button">購入する（ダミー）</button>
      <h2 id="result" aria-live="polite">購入回数：0 回</h2>
      <p>同じactionIdを再送しても、回数がもう一度増えないことを確認します。</p>
      <p><a href="index.html">試験一覧に戻る</a></p>
    </main>
    <script>
      let count = 0;
      document.getElementById("buy").addEventListener("click", () => {
        count += 1;
        document.getElementById("result").textContent = `購入回数：${count} 回`;
      });
    </script>
  </body>
</html>
