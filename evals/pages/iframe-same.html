<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; frame-src 'self' about:; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'" />
    <title>同じ出どころのiframe試験</title>
    <style>
      body { margin: 32px; color: #17324d; font: 20px/1.6 sans-serif; }
      iframe { display: block; width: 900px; max-width: 100%; height: 300px; border: 3px solid #6c849b; }
      a { color: #175c9e; }
      a:focus-visible { outline: 3px solid #c66a00; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <h1>同じ出どころのiframe試験</h1>
      <p>HTTP配信の親と同じoriginを継承するsrcdocです。中のボタンの座標取得とクリックを確認します。</p>
      <iframe title="同じ出どころの試験フレーム" srcdoc="
        <!doctype html>
        <html lang='ja'>
          <meta charset='utf-8'>
          <title>iframe内の試験</title>
          <style>
            body { margin: 24px; color: #17324d; font: 20px/1.5 sans-serif; }
            button { padding: 12px 24px; font: inherit; cursor: pointer; }
            button:focus-visible { outline: 3px solid #c66a00; outline-offset: 4px; }
          </style>
          <h2>iframe内のボタン</h2>
          <button id='frame-button' type='button'>iframe内でクリック</button>
          <h3 id='frame-result' aria-live='polite'>iframe内のクリック回数：0 回</h3>
          <script>
            let count = 0;
            document.getElementById('frame-button').addEventListener('click', () => {
              count += 1;
              document.getElementById('frame-result').textContent = 'iframe内のクリック回数：' + count + ' 回';
            });
          </script>
        </html>
      "></iframe>
      <p><a href="index.html">試験一覧に戻る</a></p>
    </main>
  </body>
</html>
