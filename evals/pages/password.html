<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'" />
    <title>通常入力・秘密入力の試験</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 24px 32px; color: #17324d; font: 18px/1.5 sans-serif; }
      .fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 24px; max-width: 1100px; }
      label { display: block; }
      input { display: block; width: 100%; margin-top: 4px; padding: 10px; border: 2px solid #6c849b; font: inherit; }
      input:focus-visible, a:focus-visible { outline: 3px solid #c66a00; outline-offset: 3px; }
      a { color: #175c9e; }
    </style>
  </head>
  <body>
    <main>
      <h1>通常入力・秘密入力の試験</h1>
      <p>すべてダミーです。秘密欄の値はread_pageに含めないことを確認します。撮影マスクは未実装です。</p>
      <div class="fields">
        <label for="ascii">通常入力（ASCII）
          <input id="ascii" name="ascii" type="text" autocomplete="off" placeholder="ASCII text" />
        </label>
        <label for="japanese">通常入力（日本語）
          <input id="japanese" name="japanese" type="text" autocomplete="off" placeholder="こんにちは、日本語の入力試験" />
        </label>
        <label for="password">秘密欄（type=password）
          <input id="password" name="password" type="password" autocomplete="off" value="dummy-type-password-1" />
        </label>
        <label for="current-password">秘密欄（autocomplete=current-password）
          <input id="current-password" name="current-password" type="text" autocomplete="current-password" value="dummy-current-password-2" />
        </label>
        <label for="new-password">秘密欄（autocomplete=new-password）
          <input id="new-password" name="new-password" type="text" autocomplete="new-password" value="dummy-new-password-3" />
        </label>
        <label for="cc-number">秘密欄（autocomplete=cc-number）
          <input id="cc-number" name="cc-number" type="text" autocomplete="cc-number" value="0000000000000000" />
        </label>
        <label for="cc-csc">秘密欄（autocomplete=cc-csc）
          <input id="cc-csc" name="cc-csc" type="text" autocomplete="cc-csc" value="000" />
        </label>
        <label for="cc-exp">秘密欄（autocomplete=cc-exp）
          <input id="cc-exp" name="cc-exp" type="text" autocomplete="cc-exp" value="01/2099" />
        </label>
      </div>
      <button id="verify-long" type="button">ASCII長文を検証</button>
      <button id="verify-japanese-long" type="button">日本語長文を検証</button>
      <h2 id="long-result">長文入力：未検証</h2>
      <p><a href="index.html">試験一覧に戻る</a></p>
    </main>
    <script>
      document.getElementById('verify-long').addEventListener('click', () => {
        // read_pageの値の省略上限に左右されず、実際の入力全体を照合する。
        const matches = document.getElementById('ascii').value === 'Ab9!'.repeat(4000);
        document.getElementById('long-result').textContent = matches ? '長文入力：全文一致' : '長文入力：不一致';
      });
      document.getElementById('verify-japanese-long').addEventListener('click', () => {
        const matches = document.getElementById('japanese').value === '日本語'.repeat(1777) + 'END1234';
        document.getElementById('long-result').textContent = matches ? '日本語長文：全文一致' : '日本語長文：不一致';
      });
    </script>
  </body>
</html>
