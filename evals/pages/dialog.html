<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'" />
    <title>ダイアログの試験</title>
    <style>
      body { margin: 32px; color: #17324d; font: 20px/1.6 sans-serif; }
      button { margin-right: 16px; padding: 16px 24px; border: 2px solid #175c9e; font: inherit; cursor: pointer; }
      button:focus-visible, a:focus-visible { outline: 3px solid #c66a00; outline-offset: 4px; }
      a { color: #175c9e; }
    </style>
  </head>
  <body>
    <main>
      <h1>ダイアログの試験</h1>
      <p>表示をCDPで通知し、勝手にacceptしないことを確認します。実データの送信・削除はありません。</p>
      <button id="alert" type="button">alertを表示する</button>
      <button id="confirm" type="button">confirmを表示する</button>
      <h2 id="result" aria-live="polite">ダイアログ：未操作</h2>
      <p><a href="index.html">試験一覧に戻る</a></p>
    </main>
    <script>
      document.getElementById("alert").addEventListener("click", () => {
        alert("ローカル試験のalertです。");
        document.getElementById("result").textContent = "alert：閉じました";
      });
      document.getElementById("confirm").addEventListener("click", () => {
        const accepted = confirm("ローカル試験のconfirmです。OKとキャンセルを確認します。");
        document.getElementById("result").textContent = accepted ? "confirm：OK" : "confirm：キャンセル";
      });
      if (new URLSearchParams(location.search).get("immediate") === "alert") {
        alert("新しいタブを開いた直後のalertです。");
        document.getElementById("result").textContent = "即時alert：閉じました";
      }
    </script>
  </body>
</html>
