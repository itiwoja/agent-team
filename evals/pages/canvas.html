<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'" />
    <title>canvasの試験</title>
    <style>
      body { margin: 32px; color: #17324d; font: 20px/1.6 sans-serif; }
      canvas { display: block; border: 2px solid #6c849b; }
      a { color: #175c9e; }
      a:focus-visible { outline: 3px solid #c66a00; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <h1>canvasの試験</h1>
      <p>描画された領域にはDOMのbuttonがありません。先の判定ができない例（T-6）です。</p>
      <canvas id="canvas" width="640" height="240" aria-label="試験用canvas">canvas対応ブラウザが必要です。</canvas>
      <h2 id="result" aria-live="polite">canvasのクリック回数：0 回</h2>
      <p><a href="index.html">試験一覧に戻る</a></p>
    </main>
    <script>
      const canvas = document.getElementById("canvas");
      const context = canvas.getContext("2d");
      let count = 0;
      context.fillStyle = "#eef3f7";
      context.fillRect(0, 0, 640, 240);
      context.fillStyle = "#175c9e";
      context.fillRect(160, 80, 320, 80);
      context.fillStyle = "white";
      context.font = "24px sans-serif";
      context.textAlign = "center";
      context.fillText("canvas内をクリック", 320, 130);
      canvas.addEventListener("click", () => {
        count += 1;
        document.getElementById("result").textContent = `canvasのクリック回数：${count} 回`;
      });
    </script>
  </body>
</html>
