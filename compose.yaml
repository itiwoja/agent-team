# ローカルの開発用。
# - db：PostgreSQL 16（packages/db・マイグレーション）の DB。データはボリューム ot-pgdata に残る
#   つなぎ先の例：DATABASE_URL=postgres://postgres:<POSTGRES_PASSWORD>@localhost:5432/open_team
# 起動：docker compose up -d ／ 止める：docker compose down（DB のデータも消すなら down -v）
# ポートは 127.0.0.1 だけに開く（同じネットワークのほかの機械から届かない）。変えるときは .env に OT_DB_PORT
name: open-team

services:
  db:
    # digest で固定する。更新：docker buildx imagetools inspect postgres:16-bookworm
    image: postgres:16.15-bookworm@sha256:efedf3595f1d6f415c08568ba171029bf54052e754cc9f030e3f2412b21f3d67
    environment:
      POSTGRES_DB: open_team
      POSTGRES_USER: postgres
      # ローカル専用。変えるなら .env に POSTGRES_PASSWORD（ボリュームを作ったあとに変えても効かない：down -v で作り直す）
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${OT_DB_PORT:-5432}:5432"
    volumes:
      - ot-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d open_team"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  ot-pgdata:
