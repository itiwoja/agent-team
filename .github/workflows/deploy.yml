# デプロイ（D-51：10/3 から毎日。15 §構成、SO §4.1・§4.7）
# main への push だけ：CI（ci.yml）→ Workload Identity 連携で GCP に入る（鍵ファイルなし）→ Artifact Registry にイメージ → Cloud Run。
# WIF のプロバイダーは「このリポジトリの main への push」だけを通す（infra/gcp-setup.sh）。PR からはデプロイできない。
# GCP の値はリポジトリの変数（Settings → Secrets and variables → Actions → Variables）から読む。
# 必須：GCP_PROJECT_ID・GCP_REGION・WIF_PROVIDER・DEPLOYER_SA（任意：AR_REPOSITORY、既定 open-team）。
# 1つでも未設定ならデプロイのジョブは飛ばす（CI だけ走る）。値は infra/gcp-setup.sh の最後に出る。
# sim-world と gateway は DEPLOY_SIM_WORLD=true（と GCP_PROJECT_NUMBER）を入れたときだけ出す（Cloud SQL・Direct VPC egress が要る）。
# 作業場（サンドボックス。D-116）は DEPLOY_SANDBOX=true を入れたときだけ出す。infra/sandbox-setup.sh を流してから true にする。
# false の間は app に SANDBOX_PROVIDER=none を渡す（作業場の道具は渡らず、作る担当は手伝う担当として動く）。
# gcal（本物の Google カレンダー）は DEPLOY_GCAL=true を入れたときだけ出す。infra/gcal-setup.sh を流し、OAuth のクライアントの値を
# google-oauth-client-id・google-oauth-client-secret に入れてから true にする。false の間は app・gateway に OAuth の秘密も GCAL_URL も渡さない（「つなぐ」が出ないだけ）。
# github（本人の GitHub のリポジトリ。D-119・18 §5）は DEPLOY_GITHUB=true を入れたときだけ出す。GitHub App を作って infra/github-setup.sh を流し、
# 秘密 github-app-private-key・github-app-client-secret と、変数 GH_APP_ID・GH_APP_CLIENT_ID・GH_APP_SLUG（GitHub の変数は GITHUB_ で始められない）を入れてから true にする。
# 流れ：イメージ → マイグレーション（Cloud Run Job migrate。追加だけ：infra/README.md）→ sim-world → gateway → app → スモークテスト。
# スモークテスト（.github/scripts/smoke.mjs）が落ちたら、控えておいた前のリビジョンへトラフィックを戻す（ロールバック）。
# 前提（infra/gcp-setup.sh）：sa-migrator・秘密 database-url-migrator・sa-deployer の guest-entry-token の読み取り。
name: deploy

on:
  push:
    branches: [main]

permissions: {}

# デプロイは1本ずつ。走っているものは止めない（途中で止めると、サービスごとに版がずれる）
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: $/.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read # ci.yml の gitleaks のジョブと同じ（呼ぶ側が上限を決める）

  deploy:
    name: Cloud Run へデプロイ
    needs: ci
    if: ${{ vars.GCP_PROJECT_ID != '' && vars.GCP_REGION != '' && vars.WIF_PROVIDER != '' && vars.DEPLOYER_SA != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # Workload Identity 連携の OIDC トークン
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev
      IMAGE_BASE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPOSITORY || 'open-team' }}
      APP_SA: sa-app@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      GATEWAY_SA: sa-gateway@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      SIM_SA: sa-sim@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      # gcal（本物の Google カレンダーのアダプター。D-113）：権限を何も持たない SA で動かす
      GCAL_SA: sa-gcal@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      # github（本人の GitHub のアダプター。D-119）：権限を何も持たない SA で動かす（App の鍵は gateway だけが持つ）
      GITHUB_SA: sa-github@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      # Cloud Run の決まった形の URL（ID トークンの aud）。プロジェクト番号が要る
      SIM_WORLD_URL: https://sim-world-${{ vars.GCP_PROJECT_NUMBER }}.${{ vars.GCP_REGION }}.run.app
      GATEWAY_URL: https://gateway-${{ vars.GCP_PROJECT_NUMBER }}.${{ vars.GCP_REGION }}.run.app
      GCAL_URL: https://gcal-${{ vars.GCP_PROJECT_NUMBER }}.${{ vars.GCP_REGION }}.run.app
      # app・gateway に渡す GCAL_URL。DEPLOY_GCAL が true でなければ空（gateway は空ならカレンダーを使わず、OAuth の秘密も求めない）
      GCAL_URL_ON: ${{ vars.DEPLOY_GCAL == 'true' && format('https://gcal-{0}.{1}.run.app', vars.GCP_PROJECT_NUMBER, vars.GCP_REGION) || '' }}
      GITHUB_URL: https://github-${{ vars.GCP_PROJECT_NUMBER }}.${{ vars.GCP_REGION }}.run.app
      # app・gateway に渡す GITHUB_URL。DEPLOY_GITHUB が true でなければ空（「GitHub をつなぐ」が出ず、App の鍵も求めない）
      GITHUB_URL_ON: ${{ vars.DEPLOY_GITHUB == 'true' && format('https://github-{0}.{1}.run.app', vars.GCP_PROJECT_NUMBER, vars.GCP_REGION) || '' }}
      # OAuth の秘密は値が入るまで参照するとデプロイが落ちるので、DEPLOY_GCAL が true のときだけ足す
      GATEWAY_SECRETS: |-
        DATABASE_URL=database-url-gateway:latest
      GATEWAY_SECRETS_GCAL: |-
        DATABASE_URL=database-url-gateway:latest
        GOOGLE_OAUTH_CLIENT_ID=google-oauth-client-id:latest
        GOOGLE_OAUTH_CLIENT_SECRET=google-oauth-client-secret:latest
        OAUTH_TOKEN_KEY=oauth-token-key:latest
      # GitHub の秘密（DEPLOY_GITHUB が true のときだけ足す。false の間は同じ DATABASE_URL の行を繰り返して空にしない）
      GATEWAY_SECRETS_GITHUB: GITHUB_APP_PRIVATE_KEY=github-app-private-key:latest
      APP_SECRETS_GITHUB: GITHUB_APP_CLIENT_SECRET=github-app-client-secret:latest
      APP_SECRETS: |-
        DATABASE_URL=database-url-app:latest
        DATABASE_URL_MAINT=database-url-maint:latest
        PHASE0_ACCESS_TOKEN=phase0-access-token:latest
        GUEST_ENTRY_TOKEN=guest-entry-token:latest
        SESSION_COOKIE_SECRET=session-cookie-secret:latest
      APP_SECRETS_GCAL: |-
        DATABASE_URL=database-url-app:latest
        GOOGLE_OAUTH_CLIENT_ID=google-oauth-client-id:latest
        GOOGLE_OAUTH_CLIENT_SECRET=google-oauth-client-secret:latest
        OAUTH_TOKEN_KEY=oauth-token-key:latest
        DATABASE_URL_MAINT=database-url-maint:latest
        PHASE0_ACCESS_TOKEN=phase0-access-token:latest
        GUEST_ENTRY_TOKEN=guest-entry-token:latest
        SESSION_COOKIE_SECRET=session-cookie-secret:latest
      APP_URL_FIXED: https://app-${{ vars.GCP_PROJECT_NUMBER }}.${{ vars.GCP_REGION }}.run.app
      # Cloud SQL（infra の手順で作る open-team-db）。unix ソケットで繋ぐ
      CLOUDSQL_INSTANCE: ${{ vars.GCP_PROJECT_ID }}:${{ vars.GCP_REGION }}:open-team-db
      # マイグレーションの Job（migrate）の実行の SA。DB のロールは ot_migrator（秘密 database-url-migrator）
      MIGRATOR_SA: sa-migrator@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      # 作業場（D-116）：権限ゼロの SA・専用のサブネット（通信はパッケージのレジストリと app だけ：infra/sandbox-setup.sh）
      SANDBOX_SA: sa-sandbox@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      SANDBOX_JOB_NAME: projects/${{ vars.GCP_PROJECT_ID }}/locations/${{ vars.GCP_REGION }}/jobs/sandbox
      SANDBOX_PROVIDER: ${{ vars.DEPLOY_SANDBOX == 'true' && 'cloudrun' || 'none' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: sim-world を出す準備の確認
        if: ${{ vars.DEPLOY_SIM_WORLD == 'true' && vars.GCP_PROJECT_NUMBER == '' }}
        run: |
          echo "::error::DEPLOY_SIM_WORLD=true のときは GCP_PROJECT_NUMBER も入れる（SIM_WORLD_URL を組むため）"
          exit 1

      - name: GCP に入る（Workload Identity 連携 → sa-deployer）
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
          token_format: access_token # Artifact Registry への docker login に使う

      # ランナーに入っている gcloud を使う（版の決まらない gcloud を毎回落とさない）
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          skip_install: true

      # ロールバック用に、今のトラフィックのリビジョンを控える（まだないサービスは空）。デプロイより前に取る
      - name: 今のリビジョンを控える
        id: prev
        run: |
          for svc in app gateway sim-world; do
            rev="$(gcloud run services describe "${svc}" --project="${PROJECT_ID}" --region="${REGION}" \
              --format='value(status.traffic[0].revisionName)' 2>/dev/null || true)"
            echo "${svc}=${rev}" >> "${GITHUB_OUTPUT}"
            echo "控え：${svc} = ${rev:-（なし）}"
          done

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # イメージはコミット SHA のタグで push し、デプロイは digest で指す（タグの付け替えで別のものが動かない）。
      # provenance・sbom の付録を付けない（1つの manifest にして Cloud Run がそのまま読めるようにする）
      - name: sim-world のイメージ
        id: build-sim-world
        if: ${{ vars.DEPLOY_SIM_WORLD == 'true' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/sim-world/Dockerfile
          push: true
          tags: ${{ env.IMAGE_BASE }}/sim-world:${{ github.sha }}
          provenance: false
          sbom: false

      - name: gcal のイメージ
        id: build-gcal
        if: ${{ vars.DEPLOY_SIM_WORLD == 'true' && vars.DEPLOY_GCAL == 'true' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/gcal/Dockerfile
          push: true
          tags: ${{ env.IMAGE_BASE }}/gcal:${{ github.sha }}
          provenance: false
          sbom: false

      - name: github のイメージ
        id: build-github
        if: ${{ vars.DEPLOY_SIM_WORLD == 'true' && vars.DEPLOY_GITHUB == 'true' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/github/Dockerfile
          push: true
          tags: ${{ env.IMAGE_BASE }}/github:${{ github.sha }}
          provenance: false
          sbom: false

      - name: gateway のイメージ
        id: build-gateway
        if: ${{ vars.DEPLOY_SIM_WORLD == 'true' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/gateway/Dockerfile
          push: true
          tags: ${{ env.IMAGE_BASE }}/gateway:${{ github.sha }}
          provenance: false
          sbom: false

      - name: app のイメージ
        id: build-app
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.IMAGE_BASE }}/app:${{ github.sha }}
          provenance: false
          sbom: false

      - name: 作業場（sandbox）のイメージ
        id: build-sandbox
        if: ${{ vars.DEPLOY_SANDBOX == 'true' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/sandbox/Dockerfile
          push: true
          tags: ${{ env.IMAGE_BASE }}/sandbox:${{ github.sha }}
          provenance: false
          sbom: false

      # マイグレーション：app と同じイメージ（digest）を Cloud Run Job で1回流し、終わるまで待つ。失敗したら以降（サービスのデプロイ）へ進まない。
      # 追加だけの決まり（古いリビジョンが動いたままでも壊れない：infra/README.md）。Job は毎回作り直し、DB へは sa-migrator → ot_migrator で入る。
      # migrate.ts は Node の型の除去でそのまま動く（Dockerfile の実行イメージの /srv/packages/db）
      - name: マイグレーションを流す
        env:
          APP_IMAGE: ${{ env.IMAGE_BASE }}/app@${{ steps.build-app.outputs.digest }}
        run: |
          gcloud run jobs deploy migrate \
            --project="${PROJECT_ID}" --region="${REGION}" \
            --image="${APP_IMAGE}" \
            --service-account="${MIGRATOR_SA}" \
            --set-cloudsql-instances="${CLOUDSQL_INSTANCE}" \
            --network=default --subnet=default --vpc-egress=all-traffic \
            --set-secrets=DATABASE_URL=database-url-migrator:latest \
            --command=node --args=/srv/packages/db/src/migrate.ts \
            --max-retries=0 --task-timeout=300 --quiet
          gcloud run jobs execute migrate --project="${PROJECT_ID}" --region="${REGION}" --wait

      # 作業場（D-116）：タスクごとに app が jobs.run（overrides でトークンを渡す）で1つ起こす。SA は権限ゼロ、
      # 通信は専用のサブネット（sandbox）と網の規則で、パッケージのレジストリと app だけに絞る（infra/sandbox-setup.sh）。
      # 起こせるのは sa-app だけ（roles/run.jobsExecutorWithOverrides）
      - name: 作業場のジョブを更新
        if: ${{ steps.build-sandbox.outcome == 'success' }}
        env:
          SANDBOX_IMAGE: ${{ env.IMAGE_BASE }}/sandbox@${{ steps.build-sandbox.outputs.digest }}
        run: |
          gcloud run jobs deploy sandbox \
            --project="${PROJECT_ID}" --region="${REGION}" \
            --image="${SANDBOX_IMAGE}" \
            --service-account="${SANDBOX_SA}" \
            --network=default --subnet=sandbox --vpc-egress=all-traffic --network-tags=sandbox \
            --cpu=1 --memory=2Gi --tasks=1 --parallelism=1 \
            --max-retries=0 --task-timeout=1800 --quiet
          gcloud run jobs add-iam-policy-binding sandbox \
            --project="${PROJECT_ID}" --region="${REGION}" \
            --member="serviceAccount:${APP_SA}" --role=roles/run.jobsExecutorWithOverrides --quiet >/dev/null

      # sim-world：Ingress は内部のみ、呼べるのは sa-gateway・sa-app だけ（15 §サービス間の境界）
      - name: sim-world をデプロイ
        id: deploy-sim-world
        if: ${{ steps.build-sim-world.outcome == 'success' }}
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.1
        with:
          service: sim-world
          image: ${{ env.IMAGE_BASE }}/sim-world@${{ steps.build-sim-world.outputs.digest }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION }}
          # 手でトラフィックを固定したあとでも、デプロイした最新のリビジョンへ戻す（固定が残るとデプロイが 0% のままになる）
          revision_traffic: LATEST=100
          env_vars: |-
            DEPLOYMENT_MODE=public
            COMMIT_SHA=${{ github.sha }}
            SIM_WORLD_URL=${{ env.SIM_WORLD_URL }}
            APP_SA_EMAIL=${{ env.APP_SA }}
            GATEWAY_SA_EMAIL=${{ env.GATEWAY_SA }}
          secrets: |-
            DATABASE_URL=database-url-sim:latest
          flags: >-
            --service-account=${{ env.SIM_SA }}
            --set-cloudsql-instances=${{ env.CLOUDSQL_INSTANCE }}
            --network=default
            --subnet=default
            --vpc-egress=all-traffic
            --ingress=internal
            --no-allow-unauthenticated
            --min-instances=0
            --max-instances=3
            --timeout=90

      - name: sim-world を呼べるのを sa-gateway・sa-app にする
        if: ${{ steps.deploy-sim-world.outcome == 'success' }}
        run: |
          for member in "serviceAccount:${GATEWAY_SA}" "serviceAccount:${APP_SA}"; do
            gcloud run services add-iam-policy-binding sim-world \
              --project="${PROJECT_ID}" --region="${REGION}" \
              --member="${member}" --role=roles/run.invoker --quiet >/dev/null
          done

      # gcal：本人がつないだ Google カレンダーのアダプター（16 §3.2、ADR-040）。DB・秘密なし、Ingress は内部のみ、呼べるのは sa-gateway だけ。
      # 外（googleapis.com）へは既定の出口で出る（VPC に入らない）
      - name: gcal をデプロイ
        id: deploy-gcal
        if: ${{ steps.build-gcal.outcome == 'success' }}
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.1
        with:
          service: gcal
          image: ${{ env.IMAGE_BASE }}/gcal@${{ steps.build-gcal.outputs.digest }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION }}
          revision_traffic: LATEST=100
          env_vars: |-
            DEPLOYMENT_MODE=public
            COMMIT_SHA=${{ github.sha }}
            GCAL_URL=${{ env.GCAL_URL }}
            GATEWAY_SA_EMAIL=${{ env.GATEWAY_SA }}
          flags: >-
            --service-account=${{ env.GCAL_SA }}
            --ingress=internal
            --no-allow-unauthenticated
            --min-instances=0
            --max-instances=3
            --timeout=60

      - name: gcal を呼べるのを sa-gateway にする
        if: ${{ steps.deploy-gcal.outcome == 'success' }}
        run: |
          gcloud run services add-iam-policy-binding gcal \
            --project="${PROJECT_ID}" --region="${REGION}" \
            --member="serviceAccount:${GATEWAY_SA}" --role=roles/run.invoker --quiet >/dev/null

      # github：本人がつないだ GitHub のアダプター（18 §3.2、D-119）。DB・秘密なし（トークンは gateway が呼ぶたびに渡す）、Ingress は内部のみ、呼べるのは sa-gateway だけ。
      # 外（api.github.com）へは既定の出口で出る（VPC に入らない）
      - name: github をデプロイ
        id: deploy-github
        if: ${{ steps.build-github.outcome == 'success' }}
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.1
        with:
          service: github
          image: ${{ env.IMAGE_BASE }}/github@${{ steps.build-github.outputs.digest }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION }}
          revision_traffic: LATEST=100
          env_vars: |-
            DEPLOYMENT_MODE=public
            COMMIT_SHA=${{ github.sha }}
            GITHUB_URL=${{ env.GITHUB_URL }}
            GATEWAY_SA_EMAIL=${{ env.GATEWAY_SA }}
          flags: >-
            --service-account=${{ env.GITHUB_SA }}
            --ingress=internal
            --no-allow-unauthenticated
            --min-instances=0
            --max-instances=3
            --timeout=120

      - name: github を呼べるのを sa-gateway にする
        if: ${{ steps.deploy-github.outcome == 'success' }}
        run: |
          gcloud run services add-iam-policy-binding github \
            --project="${PROJECT_ID}" --region="${REGION}" \
            --member="serviceAccount:${GATEWAY_SA}" --role=roles/run.invoker --quiet >/dev/null

      # gateway：Ingress は内部のみ、呼べるのは sa-app だけ。コネクタは sim-world と、本人がつないだ gcal・github だけ（BR-66・D-113・D-119）
      - name: gateway をデプロイ
        id: deploy-gateway
        if: ${{ steps.build-gateway.outcome == 'success' }}
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.1
        with:
          service: gateway
          image: ${{ env.IMAGE_BASE }}/gateway@${{ steps.build-gateway.outputs.digest }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION }}
          # 手でトラフィックを固定したあとでも、デプロイした最新のリビジョンへ戻す（固定が残るとデプロイが 0% のままになる）
          revision_traffic: LATEST=100
          env_vars: |-
            DEPLOYMENT_MODE=public
            COMMIT_SHA=${{ github.sha }}
            GATEWAY_URL=${{ env.GATEWAY_URL }}
            SIM_WORLD_URL=${{ env.SIM_WORLD_URL }}
            ALLOWED_CONNECTOR_URLS=${{ env.SIM_WORLD_URL }}${{ env.GCAL_URL_ON != '' && format(',{0}', env.GCAL_URL_ON) || '' }}${{ env.GITHUB_URL_ON != '' && format(',{0}', env.GITHUB_URL_ON) || '' }}
            GCAL_URL=${{ env.GCAL_URL_ON }}
            GITHUB_URL=${{ env.GITHUB_URL_ON }}
            GITHUB_APP_ID=${{ vars.DEPLOY_GITHUB == 'true' && vars.GH_APP_ID || '' }}
            APP_SA_EMAIL=${{ env.APP_SA }}
          secrets: |-
            ${{ vars.DEPLOY_GCAL == 'true' && env.GATEWAY_SECRETS_GCAL || env.GATEWAY_SECRETS }}
            ${{ vars.DEPLOY_GITHUB == 'true' && env.GATEWAY_SECRETS_GITHUB || 'DATABASE_URL=database-url-gateway:latest' }}
          flags: >-
            --service-account=${{ env.GATEWAY_SA }}
            --set-cloudsql-instances=${{ env.CLOUDSQL_INSTANCE }}
            --network=default
            --subnet=default
            --vpc-egress=all-traffic
            --ingress=internal
            --no-allow-unauthenticated
            --min-instances=0
            --max-instances=5
            --timeout=300

      - name: gateway を呼べるのを sa-app にする
        if: ${{ steps.deploy-gateway.outcome == 'success' }}
        run: |
          gcloud run services add-iam-policy-binding gateway \
            --project="${PROJECT_ID}" --region="${REGION}" \
            --member="serviceAccount:${APP_SA}" --role=roles/run.invoker --quiet >/dev/null

      # app：外から届くのはここだけ（入口のトークンとセッションで守る）。Gemini を呼べるのは sa-app だけ。
      # 走行・リハーサル・再試験は応答のあとも app の中で動かすので、CPU は常時割り当てる（絞ると DB の接続が切れて途中で止まる）
      # 秘密情報は Secret Manager から（値は infra/gcp-setup.sh が最初に乱数で入れる）。手で足した環境変数は残す（merge）
      - name: app をデプロイ
        id: deploy-app
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.1
        with:
          service: app
          image: ${{ env.IMAGE_BASE }}/app@${{ steps.build-app.outputs.digest }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION }}
          # 手でトラフィックを固定したあとでも、デプロイした最新のリビジョンへ戻す（固定が残るとデプロイが 0% のままになる）
          revision_traffic: LATEST=100
          env_vars: |-
            DEPLOYMENT_MODE=public
            APP_ENV=hackathon
            COMMIT_SHA=${{ github.sha }}
            GOOGLE_CLOUD_PROJECT=${{ vars.GCP_PROJECT_ID }}
            GOOGLE_CLOUD_LOCATION=global
            GEMINI_MODEL_PLANNER=gemini-3.8-flash
            GEMINI_MODEL_AGENT=gemini-3.8-flash
            APP_SA_EMAIL=${{ env.APP_SA }}
            APP_BASE_URL=${{ env.APP_URL_FIXED }}
            APP_INTERNAL_URL=${{ env.APP_URL_FIXED }}
            GATEWAY_URL=${{ env.GATEWAY_URL }}
            SIM_WORLD_URL=${{ env.SIM_WORLD_URL }}
            GCAL_URL=${{ env.GCAL_URL_ON }}
            GITHUB_URL=${{ env.GITHUB_URL_ON }}
            GITHUB_APP_CLIENT_ID=${{ vars.DEPLOY_GITHUB == 'true' && vars.GH_APP_CLIENT_ID || '' }}
            GITHUB_APP_SLUG=${{ vars.DEPLOY_GITHUB == 'true' && vars.GH_APP_SLUG || '' }}
            SANDBOX_PROVIDER=${{ env.SANDBOX_PROVIDER }}
            SANDBOX_JOB=${{ env.SANDBOX_JOB_NAME }}
            SANDBOX_EDGE_URL=${{ env.APP_URL_FIXED }}
          secrets: |-
            ${{ vars.DEPLOY_GCAL == 'true' && env.APP_SECRETS_GCAL || env.APP_SECRETS }}
            ${{ vars.DEPLOY_GITHUB == 'true' && env.APP_SECRETS_GITHUB || 'DATABASE_URL=database-url-app:latest' }}
          flags: >-
            --service-account=${{ env.APP_SA }}
            --set-cloudsql-instances=${{ env.CLOUDSQL_INSTANCE }}
            --network=default
            --subnet=default
            --vpc-egress=all-traffic
            --ingress=all
            --allow-unauthenticated
            --min-instances=0
            --max-instances=10
            --timeout=3600
            --no-cpu-throttling

      # デプロイ後のスモークテスト（.github/scripts/smoke.mjs）：デプロイした版になるまで待ち、審査員と同じ入口から入って
      # 用意した依頼・リハーサルの結果・再試験・合格証まで通す。用意した依頼の再試験は台本での再現なので Gemini の費用は 0。
      # 入口のトークンは Secret Manager から読む（sa-deployer に付けたのは guest-entry-token だけ。GitHub の Secrets には写さない）。
      # 読んだ直後にマスクし、同じステップの中だけで使う（環境変数のファイル・出力に書かない）
      - name: スモークテスト
        id: smoke
        env:
          BASE_URL: ${{ env.APP_URL_FIXED }}
          SMOKE_RETEST: "1"
        run: |
          GUEST_ENTRY_TOKEN="$(gcloud secrets versions access latest --secret=guest-entry-token --project="${PROJECT_ID}")"
          echo "::add-mask::${GUEST_ENTRY_TOKEN}"
          export GUEST_ENTRY_TOKEN
          node .github/scripts/smoke.mjs
          echo "ok: ${BASE_URL}（${GITHUB_SHA}）スモークテストを通った" >> "${GITHUB_STEP_SUMMARY}"

      # ロールバック：スモークテストなどが落ちたら、トラフィックを控えておいた前のリビジョンに戻す（サービスごと。
      # このデプロイで新しい版を出せたサービスだけ）。DB は戻さない（マイグレーションは追加だけなので、前のリビジョンはそのまま動く）。
      # 次のデプロイは revision_traffic: LATEST=100 で最新に戻る。手順は infra/README.md の「ロールバック」
      - name: app を前のリビジョンに戻す
        if: ${{ failure() && steps.deploy-app.outcome == 'success' && steps.prev.outputs.app != '' }}
        env:
          PREV_REVISION: ${{ steps.prev.outputs.app }}
        run: |
          gcloud run services update-traffic app --project="${PROJECT_ID}" --region="${REGION}" --to-revisions="${PREV_REVISION}=100"
          echo "::warning::スモークテストが落ちたので app を ${PREV_REVISION} に戻した"
          echo "ロールバック：app → ${PREV_REVISION}" >> "${GITHUB_STEP_SUMMARY}"

      - name: gateway を前のリビジョンに戻す
        if: ${{ failure() && steps.deploy-gateway.outcome == 'success' && steps.prev.outputs.gateway != '' }}
        env:
          PREV_REVISION: ${{ steps.prev.outputs.gateway }}
        run: |
          gcloud run services update-traffic gateway --project="${PROJECT_ID}" --region="${REGION}" --to-revisions="${PREV_REVISION}=100"
          echo "::warning::スモークテストが落ちたので gateway を ${PREV_REVISION} に戻した"
          echo "ロールバック：gateway → ${PREV_REVISION}" >> "${GITHUB_STEP_SUMMARY}"

      - name: sim-world を前のリビジョンに戻す
        if: ${{ failure() && steps.deploy-sim-world.outcome == 'success' && steps.prev.outputs.sim-world != '' }}
        env:
          PREV_REVISION: ${{ steps.prev.outputs.sim-world }}
        run: |
          gcloud run services update-traffic sim-world --project="${PROJECT_ID}" --region="${REGION}" --to-revisions="${PREV_REVISION}=100"
          echo "::warning::スモークテストが落ちたので sim-world を ${PREV_REVISION} に戻した"
          echo "ロールバック：sim-world → ${PREV_REVISION}" >> "${GITHUB_STEP_SUMMARY}"
